spring.application.name=deutschlern

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/deutschlern
spring.datasource.username=deutschlern
spring.datasource.password=deutschlern_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer Configuration
spring.kafka.consumer.group-id=deutschlern-progress
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Tell Kafka which Java class to deserialize into
spring.kafka.consumer.properties.spring.json.value.default.type=com.deutschlern.event.WordLearnedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.deutschlern

# Kafka Streams Configuration
spring.kafka.streams.application-id=deutschlern-analytics
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.auto.offset.reset=earliest